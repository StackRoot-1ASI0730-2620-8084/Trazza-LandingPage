<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Trazza</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-header">
            <a href="index.html" class="logo">
                <i class="ph-fill ph-truck"></i>
                <div class="logo-text">
                    <span class="brand">TRAZZA</span>
                </div>
            </a>
            <h2>Bienvenido de vuelta</h2>
            <p>Ingresa a tu cuenta para continuar</p>
        </div>

        <div class="toggle-container auth-role-toggle">
            <button class="toggle-btn active" id="btn-transportista"><i class="ph ph-truck"></i> Transportista</button>
            <button class="toggle-btn" id="btn-emprendedor"><i class="ph ph-storefront"></i> Emprendedor</button>
        </div>

        <form class="auth-form" action="index.html">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" class="form-input" placeholder="tu@correo.com" required>
            </div>
            <div class="form-group">
                <div class="flex-between">
                    <label for="password">Contraseña</label>
                    <a href="#" style="font-size: 12px; color: var(--primary);">¿Olvidaste tu contraseña?</a>
                </div>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-large" style="width: 100%; margin-top: 8px;">Iniciar Sesión</button>
        </form>

        <div class="auth-footer">
            ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
        </div>
    </div>

    <script src="./scripts/main.js"></script>
</body>
</html>
